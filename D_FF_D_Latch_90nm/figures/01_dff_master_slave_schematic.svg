<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .w{stroke:#111;stroke-width:3;fill:none}
      .thin{stroke:#111;stroke-width:2;fill:none}
      .b{fill:#fff;stroke:#111;stroke-width:3}
      .t{font:24px Arial, sans-serif;fill:#111}
      .s{font:18px Arial, sans-serif;fill:#111}
      .m{font:16px Arial, sans-serif;fill:#555}
      .pin{fill:#d22;stroke:#111;stroke-width:1.5}
      .node{fill:#1573d1}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="42" y="52" class="t">Positive-edge D Flip-Flop from two static TG D-latches</text>
  <text x="42" y="86" class="s">Master transparent when CLK=0. Slave transparent when CLK=1. Q changes after the rising clock edge.</text>

  <polygon points="70,210 105,190 105,230" class="pin"/>
  <text x="35" y="217" class="t">D</text>
  <line x1="105" y1="210" x2="260" y2="210" class="w" marker-end="url(#arrow)"/>

  <rect x="260" y="135" width="310" height="210" rx="8" class="b"/>
  <text x="340" y="172" class="t">Master D-latch</text>
  <text x="302" y="216" class="s">EN = CLKB</text>
  <text x="302" y="250" class="s">ENB = CLK</text>
  <text x="302" y="296" class="m">Samples D while CLK is low</text>
  <text x="302" y="322" class="m">Holds Qm at rising edge</text>

  <line x1="570" y1="210" x2="735" y2="210" class="w" marker-end="url(#arrow)"/>
  <circle cx="655" cy="210" r="8" class="node"/>
  <text x="625" y="190" class="t">Qm</text>
  <line x1="655" y1="210" x2="655" y2="300" class="thin"/>
  <polygon points="655,322 635,287 675,287" class="pin"/>
  <text x="688" y="310" class="s">debug only</text>

  <rect x="735" y="135" width="310" height="210" rx="8" class="b"/>
  <text x="825" y="172" class="t">Slave D-latch</text>
  <text x="777" y="216" class="s">EN = CLK</text>
  <text x="777" y="250" class="s">ENB = CLKB</text>
  <text x="777" y="296" class="m">Closed while master samples</text>
  <text x="777" y="322" class="m">Drives Q after CLK rises</text>

  <line x1="1045" y1="210" x2="1245" y2="210" class="w" marker-end="url(#arrow)"/>
  <polygon points="1275,210 1240,190 1240,230" class="pin"/>
  <text x="1292" y="217" class="t">Q</text>

  <polygon points="70,535 105,515 105,555" class="pin"/>
  <text x="15" y="542" class="t">CLK</text>
  <line x1="105" y1="535" x2="245" y2="535" class="w"/>
  <polygon points="245,488 245,582 340,535" class="b"/>
  <circle cx="354" cy="535" r="12" class="b"/>
  <text x="250" y="615" class="s">clock_inv</text>
  <line x1="366" y1="535" x2="1260" y2="535" class="w"/>
  <polygon points="1290,535 1255,515 1255,555" class="pin"/>
  <text x="1308" y="542" class="t">CLKB optional</text>
  <text x="430" y="515" class="t">CLKB</text>

  <line x1="160" y1="535" x2="160" y2="405" class="thin"/>
  <line x1="160" y1="405" x2="420" y2="405" class="thin"/>
  <line x1="420" y1="405" x2="420" y2="345" class="thin"/>
  <text x="196" y="392" class="s">CLK to master ENB</text>

  <line x1="505" y1="535" x2="505" y2="405" class="thin"/>
  <line x1="505" y1="405" x2="350" y2="405" class="thin"/>
  <line x1="350" y1="405" x2="350" y2="345" class="thin"/>
  <text x="515" y="392" class="s">CLKB to master EN</text>

  <line x1="945" y1="535" x2="945" y2="405" class="thin"/>
  <line x1="945" y1="405" x2="890" y2="405" class="thin"/>
  <line x1="890" y1="405" x2="890" y2="345" class="thin"/>
  <text x="955" y="392" class="s">CLK to slave EN</text>

  <line x1="780" y1="535" x2="780" y2="405" class="thin"/>
  <line x1="780" y1="405" x2="955" y2="405" class="thin"/>
  <line x1="955" y1="405" x2="955" y2="345" class="thin"/>
  <text x="692" y="392" class="s">CLKB to slave ENB</text>

  <rect x="65" y="635" width="1180" height="45" rx="6" fill="#f4f7fb" stroke="#b6c4d8"/>
  <text x="88" y="664" class="s">Main timing metric: FMAX approx 1 / (tCQ,max + tSETUP + skew_margin). Use post-layout waveform if available.</text>
</svg>
