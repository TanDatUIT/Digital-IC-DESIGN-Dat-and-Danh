<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <style>
      .b{fill:#fff;stroke:#111;stroke-width:3}
      .h{fill:#eef4ff;stroke:#7c93b8;stroke-width:2}
      .g{fill:#f7fff8;stroke:#86b88a;stroke-width:2}
      .w{stroke:#111;stroke-width:3;fill:none}
      .t{font:24px Arial,sans-serif;fill:#111}
      .s{font:18px Arial,sans-serif;fill:#111}
      .m{font:16px Arial,sans-serif;fill:#555}
      .mono{font:18px Consolas,monospace;fill:#111}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="45" y="52" class="t">Baseline transistor sizing for 90nm D-latch/DFF</text>
  <text x="45" y="84" class="s">Current plan uses L = 0.10um for FMAX. If needed for robustness/layout, try L = 0.12um or 0.18um.</text>

  <g transform="translate(70,130)">
    <rect x="0" y="0" width="1320" height="58" class="h"/>
    <text x="20" y="37" class="s">Block</text>
    <text x="330" y="37" class="s">NMOS W/L</text>
    <text x="565" y="37" class="s">PMOS W/L</text>
    <text x="810" y="37" class="s">Reason</text>

    <g class="mono">
      <rect x="0" y="58" width="1320" height="74" class="b"/>
      <text x="20" y="103">INV_store</text><text x="330" y="103">0.12u / 0.10u</text><text x="565" y="103">0.30u / 0.10u</text><text x="810" y="95" class="s">small storage inverter; low input cap</text><text x="810" y="120" class="s">but enough gain for stable latch</text>
      <rect x="0" y="132" width="1320" height="74" class="g"/>
      <text x="20" y="177">INV_out</text><text x="330" y="177">0.18u / 0.10u</text><text x="565" y="177">0.42u / 0.10u</text><text x="810" y="169" class="s">drives Qm/Q and next latch</text><text x="810" y="194" class="s">main knob for tCQ</text>
      <rect x="0" y="206" width="1320" height="74" class="b"/>
      <text x="20" y="251">TG_in</text><text x="330" y="251">0.18u / 0.10u</text><text x="565" y="251">0.28u / 0.10u</text><text x="810" y="243" class="s">low Ron for setup path</text><text x="810" y="268" class="s">PMOS larger for logic-1 pass</text>
      <rect x="0" y="280" width="1320" height="74" class="g"/>
      <text x="20" y="325">TG_feedback</text><text x="330" y="325">0.10-0.12u / 0.10u</text><text x="565" y="325">0.20-0.24u / 0.10u</text><text x="810" y="317" class="s">weaker than TG_in</text><text x="810" y="342" class="s">keeps state without fighting writes</text>
      <rect x="0" y="354" width="1320" height="74" class="b"/>
      <text x="20" y="399">clock_inv</text><text x="330" y="399">0.24u / 0.10u</text><text x="565" y="399">0.60u / 0.10u</text><text x="810" y="391" class="s">drives TG control load</text><text x="810" y="416" class="s">balance CLK/CLKB edge timing</text>
    </g>
  </g>

  <rect x="90" y="620" width="590" height="120" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <text x="118" y="653" class="s">Optimization order</text>
  <text x="118" y="685" class="m">1. If setup is bad: enlarge master TG_in and INV_store.</text>
  <text x="118" y="711" class="m">2. If tCQ is bad: enlarge slave TG_in and INV_out.</text>
  <text x="118" y="737" class="m">3. If write is weak: reduce feedback TG or enlarge TG_in.</text>

  <rect x="770" y="620" width="590" height="120" rx="8" fill="#fff7e8" stroke="#e0b466" stroke-width="2"/>
  <text x="798" y="653" class="s">Report note</text>
  <text x="798" y="685" class="m">These are starting W/L values. Final values should be justified</text>
  <text x="798" y="711" class="m">by pre-layout/post-layout waveform: rise/fall, tCQ, setup, hold,</text>
  <text x="798" y="737" class="m">and area from the layout bounding box.</text>
</svg>
