<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrowBlue" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L14,5 L0,10 Z" fill="#0b57d0"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L14,5 L0,10 Z" fill="#b06000"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#101418}.sub{font:21px Arial,sans-serif;fill:#30363d}.h{font:700 25px Arial,sans-serif;fill:#111}.txt{font:20px Arial,sans-serif;fill:#111}.small{font:17px Arial,sans-serif;fill:#333}.mono{font:19px Consolas,monospace;fill:#111}.box{fill:#f8fbff;stroke:#2f3946;stroke-width:3}.good{fill:#ecfdf3;stroke:#188038;stroke-width:3}.warn{fill:#fff8e1;stroke:#c58a00;stroke-width:3}.pmos{fill:#ffd9df;stroke:#b3261e;stroke-width:3}.nmos{fill:#dff7df;stroke:#188038;stroke-width:3}.wireData{stroke:#0b57d0;stroke-width:5;fill:none;marker-end:url(#arrowBlue)}.wireFb{stroke:#b06000;stroke-width:5;fill:none;marker-end:url(#arrowOrange)}.wireEn{stroke:#7b1fa2;stroke-width:5;fill:none}.wireEnb{stroke:#00838f;stroke-width:5;fill:none}.dim{stroke:#555;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="58" class="title">Kiem tra noi cheo EN/ENB cho D-latch transmission-gate</text>
  <text x="50" y="93" class="sub">Ket luan: giu noi cheo. TG_in va TG_feedback phai mo nguoc pha de tranh D va feedback tranh nhau tren node n1.</text>

  <rect x="55" y="125" width="700" height="555" rx="8" class="box"/>
  <text x="260" y="168" class="h">TG_in - duong ghi D</text>
  <text x="102" y="208" class="txt">Mo khi EN=1, ENB=0</text>
  <path d="M95 390 H235" class="wireData"/><text x="80" y="375" class="h">D</text>
  <path d="M520 390 H675" class="wireData"/><text x="638" y="375" class="h">n1</text>
  <rect x="240" y="285" width="260" height="85" rx="7" class="pmos"/><text x="322" y="337" class="h">PMOS</text><text x="302" y="275" class="mono">gate = ENB</text>
  <rect x="240" y="430" width="260" height="85" rx="7" class="nmos"/><text x="322" y="482" class="h">NMOS</text><text x="310" y="548" class="mono">gate = EN</text>
  <path d="M370 245 V285" class="wireEnb"/><path d="M370 515 V560" class="wireEn"/>
  <rect x="95" y="590" width="580" height="60" rx="7" class="good"/>
  <text x="120" y="627" class="txt">Dung: EN=1 lam NMOS ON, ENB=0 lam PMOS ON, D di vao n1.</text>

  <rect x="845" y="125" width="700" height="555" rx="8" class="box"/>
  <text x="1050" y="168" class="h">TG_feedback - duong giu Q</text>
  <text x="895" y="208" class="txt">Mo khi EN=0, ENB=1, nen clock phai noi cheo voi TG_in</text>
  <path d="M885 390 H1025" class="wireFb"/><text x="870" y="375" class="h">Q</text>
  <path d="M1310 390 H1465" class="wireFb"/><text x="1425" y="375" class="h">n1</text>
  <rect x="1030" y="285" width="260" height="85" rx="7" class="pmos"/><text x="1112" y="337" class="h">PMOS</text><text x="1108" y="275" class="mono">gate = EN</text>
  <rect x="1030" y="430" width="260" height="85" rx="7" class="nmos"/><text x="1112" y="482" class="h">NMOS</text><text x="1098" y="548" class="mono">gate = ENB</text>
  <path d="M1160 245 V285" class="wireEn"/><path d="M1160 515 V560" class="wireEnb"/>
  <rect x="895" y="590" width="580" height="60" rx="7" class="good"/>
  <text x="920" y="627" class="txt">Dung: EN=0 lam PMOS ON, ENB=1 lam NMOS ON, Q feedback ve n1.</text>

  <rect x="55" y="720" width="1490" height="125" rx="8" class="warn"/>
  <text x="85" y="760" class="h">Bang trang thai can ghi vao bao cao</text>
  <text x="85" y="800" class="mono">EN=1, ENB=0  -> TG_in ON,  TG_feedback OFF -> latch transparent: D -> n1 -> Q</text>
  <text x="85" y="832" class="mono">EN=0, ENB=1  -> TG_in OFF, TG_feedback ON  -> latch hold: Q -> TG_feedback -> n1</text>
  <text x="1010" y="800" class="small">Neu khong noi cheo feedback, hai TG co the cung mo, gay tranh chap tai n1.</text>
  <text x="1010" y="832" class="small">S/D cua TG gan theo net layout; ve dien hoc co the doi vai.</text>
  <line x1="90" y1="700" x2="1510" y2="700" class="dim"/>
  <text x="640" y="706" class="small">Mau tim = EN, mau xanh cyan = ENB, xanh duong = data, cam = feedback</text>
</svg>
