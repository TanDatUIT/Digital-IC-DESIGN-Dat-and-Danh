<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <defs>
    <style>
      .rail{fill:#e8f0ff;stroke:#335c99;stroke-width:3}
      .n{fill:#eaffea;stroke:#188038;stroke-width:3}
      .p{fill:#ffecec;stroke:#b3261e;stroke-width:3}
      .wire{stroke:#111;stroke-width:3;fill:none}
      .clk{stroke:#7b1fa2;stroke-width:4;fill:none}
      .t{font:24px Arial,sans-serif;fill:#111}
      .s{font:18px Arial,sans-serif;fill:#111}
      .m{font:16px Arial,sans-serif;fill:#555}
      .tag{font:17px Consolas,monospace;fill:#111}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="45" y="52" class="t">Layout floorplan guideline for compact TG master-slave DFF</text>
  <text x="45" y="84" class="s">Place by signal flow D -> master -> Qm -> slave -> Q. Keep Qm and storage nodes short.</text>

  <rect x="80" y="130" width="1280" height="42" class="rail"/>
  <text x="105" y="158" class="s">VDD rail, M1/M2 wide enough, straight horizontal</text>
  <rect x="80" y="620" width="1280" height="42" class="rail"/>
  <text x="105" y="648" class="s">GND rail, substrate taps nearby</text>

  <rect x="150" y="210" width="460" height="330" rx="10" fill="#fbfdff" stroke="#7c93b8" stroke-width="3"/>
  <text x="305" y="242" class="s">MASTER LATCH</text>
  <rect x="185" y="275" width="95" height="70" class="p"/><text x="195" y="318" class="tag">TG_in P</text>
  <rect x="185" y="415" width="95" height="70" class="n"/><text x="195" y="458" class="tag">TG_in N</text>
  <rect x="315" y="275" width="95" height="70" class="p"/><text x="328" y="318" class="tag">INV1 P</text>
  <rect x="315" y="415" width="95" height="70" class="n"/><text x="328" y="458" class="tag">INV1 N</text>
  <rect x="445" y="275" width="95" height="70" class="p"/><text x="458" y="318" class="tag">INV2 P</text>
  <rect x="445" y="415" width="95" height="70" class="n"/><text x="458" y="458" class="tag">INV2 N</text>
  <text x="210" y="520" class="m">Feedback TG close to node n1</text>

  <rect x="740" y="210" width="460" height="330" rx="10" fill="#fbfdff" stroke="#7c93b8" stroke-width="3"/>
  <text x="900" y="242" class="s">SLAVE LATCH</text>
  <rect x="775" y="275" width="95" height="70" class="p"/><text x="785" y="318" class="tag">TG_in P</text>
  <rect x="775" y="415" width="95" height="70" class="n"/><text x="785" y="458" class="tag">TG_in N</text>
  <rect x="905" y="275" width="95" height="70" class="p"/><text x="918" y="318" class="tag">INV1 P</text>
  <rect x="905" y="415" width="95" height="70" class="n"/><text x="918" y="458" class="tag">INV1 N</text>
  <rect x="1035" y="275" width="95" height="70" class="p"/><text x="1048" y="318" class="tag">INV2 P</text>
  <rect x="1035" y="415" width="95" height="70" class="n"/><text x="1048" y="458" class="tag">INV2 N</text>
  <text x="800" y="520" class="m">Output buffer only if load is large</text>

  <line x1="120" y1="380" x2="185" y2="380" class="wire"/><text x="90" y="387" class="s">D</text>
  <line x1="540" y1="380" x2="775" y2="380" class="wire"/><text x="630" y="365" class="s">Qm short route</text>
  <line x1="1130" y1="380" x2="1270" y2="380" class="wire"/><text x="1285" y="387" class="s">Q</text>

  <path d="M150 585 C300 560, 445 560, 610 585" class="clk"/>
  <path d="M740 585 C895 560, 1045 560, 1200 585" class="clk"/>
  <text x="205" y="590" class="s">CLK/CLKB routes matched inside master</text>
  <text x="785" y="590" class="s">CLK/CLKB routes matched inside slave</text>

  <rect x="92" y="704" width="1270" height="54" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <text x="120" y="738" class="s">Layout priorities: short internal nodes n1/n2/Qm, shared diffusion where LVS remains clean, regular PMOS/NMOS rows, taps near both rows, DRC -> LVS -> LPE.</text>
</svg>
